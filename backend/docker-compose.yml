version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=baraka_user
      - POSTGRES_PASSWORD=baraka_pass
      - POSTGRES_DB=barakatoken_db
    ports:
      - "5432:5432"

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
      - ./media:/code/media
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://baraka_user:baraka_pass@db:5432/barakatoken_db
    depends_on:
      - db

volumes:
  postgres_data:
